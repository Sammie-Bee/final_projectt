services:
  - type: web
    name: northstar-bank-backend
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    rootDir: .
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: "5000"
        sync: false
